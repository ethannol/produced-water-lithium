[project]
name = "produced-water-lithium"
version = "0.1.0"
description = "Where is lithium in U.S. oil and gas produced water, and how much of that picture is an artifact of what was sampled, measured and compiled? A pre-registered study on the USGS National Produced Waters Geochemical Database v3.0, run under the cairn harness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ethan Levy", email = "ethannol@gmail.com" }]
dependencies = [
    "cairn",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv.sources]
cairn = { path = "../cairn", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pwlithium"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"]
